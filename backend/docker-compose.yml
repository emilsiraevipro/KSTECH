services:
  postgres: 
    container_name: postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: KSTECH
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5434:5432
    volumes: 
      - postgres-data:/var/lib/postgresql/data

  kstech.api:
    image: ${DOCKER_REGISTRY-}kstechapi
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres

volumes:
  postgres-data: